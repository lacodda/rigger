# How rigger is released: read by furca's release engine (`furca release plan`,
# `run`, `verify`) and by `lyrn check`, which holds the installers to the
# release page and, with `--release`, checks what a release put out.
# Reference: https://lacodda.github.io/furca/reference/release/

[project]
name = "rigger"
changelog = "CHANGELOG.md"
# The crate, and the npm wrapper that downloads its binary.
manifests = ["Cargo.toml", "npm/package.json"]
# Left as written: decisions record what happened at the time, and the pages and
# the README show a made-up project's versions in their examples.
as_written = [
    "README.md",
    "docs/adr/",
    "docs/src/content/docs/concepts/",
    "docs/src/content/docs/getting-started.md",
    "docs/src/content/docs/guides/",
    "docs/src/content/docs/index.mdx",
    "docs/src/content/docs/reference/",
]

[gate]
commands = [
    "cargo fmt --all --check",
    "cargo clippy --all-targets -- -D warnings",
    "cargo test",
]

[ci]
provider = "github"
workflow = "ci.yml"
publish = "publish.yml"

[[package]]
registry = "crates"
name = "rigger"
manifest = "Cargo.toml"

[[package]]
registry = "npm"
name = "@lacodda/rigger"
manifest = "npm/package.json"
wraps = "rigger"

# The files the tag's release page has to carry: checked after the publish,
# and against the targets the installers ask for on every commit.
[page]
assets = [
    "rigger-{tag}-x86_64-pc-windows-msvc.zip",
    "rigger-{tag}-x86_64-unknown-linux-gnu.tar.gz",
    "rigger-{tag}-aarch64-apple-darwin.tar.gz",
]

# rigger is installed for the owner from the release by tools/install.ps1 and
# tools/install.sh, and proven to be the release's own build.
[post.install]
