name: Publish

# The first publication to each registry is done by hand: OIDC trusted
# publishing cannot be bound to a package that does not exist yet. Once the
# names are claimed and the trust is configured, the tag trigger below takes
# over. Until then this workflow runs only on demand.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (e.g. v0.1.0)
        required: true

permissions: {}

jobs:
  crates-io:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Get a crates.io token (OIDC trusted publishing)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      # npm >= 11.5.1 exchanges the OIDC token itself (trusted publishing);
      # provenance is attached automatically.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # One README for all three pages. npm publishes whatever sits next to
      # package.json, so the root file is copied in here rather than kept as a
      # second copy in the repo, where it drifts from the original.
      - name: Use the root README for the npm page
        run: cp README.md npm/README.md
      # A scoped package is private by default; the line publishes in the open.
      - run: npm publish --access public
        working-directory: npm
